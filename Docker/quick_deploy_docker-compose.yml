# ZingLib -- recommended deployment: the application and its pgvector database.
#
# The image is public, so this file works with no build step:
#   docker compose -f Docker/quick_deploy_docker-compose.yml up -d
#
# Point it at your own build with:  ZINGLIB_IMAGE=zinglib:local
services:
  pg17:
    image: pgvector/pgvector:pg17
    container_name: zinglib-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}   # <-- 数据库用户名，默认为 postgres/Default username for the database, default is postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # <-- 数据库密码，默认为 postgres/Default password for the database, default is postgres
      POSTGRES_DB: ${POSTGRES_DB:-zinglib_library} # <-- 数据库名称，默认为 zinglib_library/Default database name, default is zinglib_library
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./zinglib/pgvector}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zinglib_library}"]
      interval: 10s
      timeout: 5s
      retries: 12

  data-ui:
    # Published public image (linux/amd64 + linux/arm64). Nothing to build, nothing
    # to substitute -- override ZINGLIB_IMAGE only if you want your own build.
    image: ${ZINGLIB_IMAGE:-jbking114514/zinglib:latest}
    container_name: zinglib
    command: ["data-ui"]

    ports:
      - "8501:8501"
    ulimits:
      nofile:
        soft: ${DATA_UI_NOFILE_SOFT:-65535}
        hard: ${DATA_UI_NOFILE_HARD:-65535}
    environment:
      THUMB_CLIENT_ROTATE_S: ${THUMB_CLIENT_ROTATE_S:-1200}
      THUMB_CLIENT_KEEPALIVE_EXPIRY_S: ${THUMB_CLIENT_KEEPALIVE_EXPIRY_S:-8}
    volumes:
      - ${YOUR_LOCAL_PATH:-./zinglib/runtime}:/app/runtime
    restart: unless-stopped
    depends_on:
      pg17:
        condition: service_healthy
