# ZingLib -- recommended deployment: the application and its pgvector database.
#
# The image is public, so this file works with no build step:
#   docker compose -f Docker/quick_deploy_docker-compose.yml up -d
#
# Point it at your own build with:  ZINGLIB_IMAGE=zinglib:local
services:
  pg17:
    image: pgvector/pgvector:pg17
    container_name: zinglib-db
    # `pgvector-db` is the container name v1.0.0 shipped, and the Setup Wizard
    # told users to type it. Anyone who has upgraded kept it in the saved config,
    # which is resolved with higher precedence than these environment defaults --
    # so without this alias the application rebuilds its DSN against a hostname
    # that no longer resolves and cannot connect at all. Keep both names working;
    # the alias costs nothing and removes the whole class of upgrade breakage.
    networks:
      default:
        aliases:
          - pgvector-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}   # <-- 数据库用户名，默认为 postgres/Default username for the database, default is postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # <-- 数据库密码，默认为 postgres/Default password for the database, default is postgres
      POSTGRES_DB: ${POSTGRES_DB:-zinglib_library} # <-- 数据库名称，默认为 zinglib_library/Default database name, default is zinglib_library
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./zinglib/pgvector}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # `pg_isready` only reports whether the server answers -- it never checks
      # that the named database exists (`-d definitely_not_here` also returns
      # "accepting connections"). `-d` here just keeps the probe honest about
      # which server we mean to be talking to.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zinglib_library}"]
      interval: 10s
      timeout: 5s
      retries: 12

  data-ui:
    # Published public image (linux/amd64 + linux/arm64). Nothing to build, nothing
    # to substitute -- override ZINGLIB_IMAGE only if you want your own build.
    image: ${ZINGLIB_IMAGE:-jbking114514/zinglib:latest}
    container_name: zinglib
    command: ["data-ui"]

    ports:
      - "8501:8501"
    ulimits:
      nofile:
        soft: ${DATA_UI_NOFILE_SOFT:-65535}
        hard: ${DATA_UI_NOFILE_HARD:-65535}
    environment:
      THUMB_CLIENT_ROTATE_S: ${THUMB_CLIENT_ROTATE_S:-1200}
      THUMB_CLIENT_KEEPALIVE_EXPIRY_S: ${THUMB_CLIENT_KEEPALIVE_EXPIRY_S:-8}
      # The same coordinates `pg17` was just started with, so one `.env` drives
      # both sides. Without them the application falls back to the spec defaults
      # in `webapi/core/constants.py`, and a `.env` that renames the database,
      # the user or the password would move the database container and leave the
      # app still connecting to the old name.
      #
      # On a brand-new database the app still lands in the Setup Wizard: there
      # is no config table to read yet, so these decide which values the wizard
      # starts from rather than skipping it. On an existing install they lose to
      # the saved config (resolution order is db > json > env).
      POSTGRES_HOST: ${POSTGRES_HOST:-zinglib-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-zinglib_library}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      # `POSTGRES_DSN` is deliberately not forwarded: `_build_dsn` rebuilds the
      # URL from the parts above whenever host, user and database are all set,
      # so a DSN here would be silently ignored.
    volumes:
      - ${YOUR_LOCAL_PATH:-./zinglib/runtime}:/app/runtime
    restart: unless-stopped
    depends_on:
      pg17:
        condition: service_healthy
