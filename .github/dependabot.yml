# Keep the dependency surface current without relying on floating tags.
#
# The workflow pins every action to a commit SHA on purpose: a mutable major tag
# lets a compromised or re-pointed upstream tag run arbitrary code in this
# repository's CI, with the Docker Hub token in scope. Pinning removes that, at
# the cost of going stale -- which is what this file pays for. Dependabot opens a
# PR that updates both the SHA and the `# vX` comment beside it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/Docker/main/webapp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/Docker/main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
